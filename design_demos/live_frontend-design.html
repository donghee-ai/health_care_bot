<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14251E" />
<title>UNO·Q Health Care Bot — Field Optics</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   FIELD OPTICS — frontend-design skill
   Thesis: this robot's defining trait is a GAZE that physically
   follows you (camera on a PTZ servo). The whole identity is an
   optical coaching instrument: reticle, field-of-view, telemetry.
   Palette derived from the subject, deliberately NOT the Toss
   purple/blue default and NOT the three AI-cliche looks.
   Wired to the real robot: /stream.mjpg + /stats.json when present,
   graceful demo fallback (getUserMedia) otherwise.
   ============================================================ */
:root{
  --paper:#E8E4D8;      /* warm bone ground */
  --paper-2:#DEDACB;    /* recessed panels */
  --spruce:#14251E;     /* deep green-ink — instrument housing */
  --moss:#3A4A3F;       /* mid structure */
  --zest:#C9E85B;       /* luminous chartreuse — the vital signal */
  --zest-deep:#9FBE2E;
  --clay:#E4633A;       /* alert only, used sparingly */
  --mist:#B7BDAE;       /* hairlines / grid */
  --ink-60:rgba(20,37,30,.6);
  --ink-40:rgba(20,37,30,.4);
  --radius:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Inter",system-ui,sans-serif;
  color:var(--spruce);
  background:var(--paper);
  background-image:
    linear-gradient(var(--mist) .5px,transparent .5px),
    linear-gradient(90deg,var(--mist) .5px,transparent .5px);
  background-size:34px 34px;background-position:center;
  -webkit-font-smoothing:antialiased;min-height:100dvh;
  padding:clamp(14px,2.2vw,26px);
}
.fo-frame{
  max-width:1220px;margin:0 auto;border:1.5px solid var(--spruce);
  background:rgba(232,228,216,.72);backdrop-filter:blur(2px);
  min-height:calc(100dvh - clamp(28px,4.4vw,52px));display:flex;flex-direction:column;
}
.fo-head{display:flex;align-items:center;gap:16px;padding:14px clamp(14px,2vw,24px);border-bottom:1.5px solid var(--spruce)}
.fo-mark{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(15px,1.9vw,19px);letter-spacing:-.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.fo-eye{width:22px;height:22px;border:2px solid var(--spruce);border-radius:50%;display:grid;place-items:center;flex:0 0 auto;position:relative}
.fo-eye::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--spruce)}
.fo-eye::before{content:"";position:absolute;inset:-5px;border:1px solid var(--ink-40);border-radius:50%;animation:fo-iris 4s ease-in-out infinite}
@keyframes fo-iris{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.25);opacity:.2}}
.fo-mark small{font-family:"Space Mono",monospace;font-weight:400;font-size:11px;color:var(--moss);letter-spacing:.04em}
.fo-head-spacer{flex:1}
.fo-status{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.06em;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.fo-dot{width:8px;height:8px;border-radius:50%;background:var(--zest-deep);box-shadow:0 0 0 0 var(--zest);animation:fo-live 2s infinite}
@keyframes fo-live{0%{box-shadow:0 0 0 0 rgba(159,190,46,.6)}70%{box-shadow:0 0 0 7px rgba(159,190,46,0)}100%{box-shadow:0 0 0 0 rgba(159,190,46,0)}}
.fo-dot.sim{background:var(--clay);animation:none}
.fo-clock{font-family:"Space Mono",monospace;font-size:12px;color:var(--moss);letter-spacing:.04em}
.fo-body{display:grid;grid-template-columns:1.62fr .95fr;flex:1;min-height:0}
@media(max-width:820px){.fo-body{grid-template-columns:1fr}}
.fo-view{position:relative;border-right:1.5px solid var(--spruce);overflow:hidden;min-height:340px;background:#0e1a15}
@media(max-width:820px){.fo-view{border-right:none;border-bottom:1.5px solid var(--spruce);aspect-ratio:4/3}}
/* AESTHETIC RISK: recolor the live feed into the instrument's duotone
   so the camera itself becomes part of the visual identity. Applies to
   both the robot MJPEG (live) and the local webcam (demo). */
.fo-feed-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15) brightness(.92)}
.fo-view video.fo-feed-img{transform:scaleX(-1)}   /* selfie mirror only for local webcam */
.fo-view img.fo-feed-img{transform:none}            /* robot view is not mirrored */
.fo-hide{display:none !important}
.fo-duo{position:absolute;inset:0;pointer-events:none;background:linear-gradient(145deg,rgba(20,37,30,.86),rgba(20,37,30,.15) 55%,rgba(201,232,91,.32));mix-blend-mode:screen}
.fo-grain{position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.35'/></svg>")}
.fo-hud{position:absolute;inset:0;width:100%;height:100%}
.fo-view-tag{position:absolute;left:12px;top:12px;font-family:"Space Mono",monospace;font-size:11px;color:var(--zest);letter-spacing:.14em;text-transform:uppercase;background:rgba(20,37,30,.55);padding:4px 8px;border:1px solid rgba(201,232,91,.4)}
.fo-view-coord{position:absolute;right:12px;bottom:12px;font-family:"Space Mono",monospace;font-size:11px;color:var(--paper);letter-spacing:.06em;text-align:right;line-height:1.5;background:rgba(20,37,30,.55);padding:6px 9px;border:1px solid rgba(255,255,255,.14)}
.fo-view-coord b{color:var(--zest);font-weight:700}
.fo-cta{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Space Mono",monospace;font-size:12px;color:var(--paper);border:1px solid var(--zest);background:rgba(20,37,30,.7);padding:10px 16px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;transition:background .15s,transform .08s}
.fo-cta:hover{background:rgba(201,232,91,.18)}
.fo-cta:active{transform:translate(-50%,-50%) scale(.96)}
.fo-cta[hidden]{display:none}
.fo-rail{display:flex;flex-direction:column;min-height:0}
.fo-seg{display:flex;border-bottom:1.5px solid var(--spruce)}
.fo-seg button{flex:1;font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:13px;padding:12px 6px;background:transparent;border:none;border-right:1px solid var(--mist);color:var(--moss);cursor:pointer;letter-spacing:.01em;transition:color .15s,background .15s}
.fo-seg button:last-child{border-right:none}
.fo-seg button[aria-pressed="true"]{background:var(--spruce);color:var(--zest)}
.fo-count{padding:clamp(16px,3vw,30px) clamp(16px,2vw,24px) 10px;border-bottom:1.5px solid var(--spruce);position:relative}
.fo-count .lbl{font-family:"Space Mono",monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--moss)}
.fo-mode{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(20px,3vw,26px);letter-spacing:-.01em;margin-top:2px}
.fo-reps{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(78px,15vw,128px);line-height:.88;letter-spacing:-.05em;margin:6px 0 2px;display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.fo-reps .goal{font-size:clamp(20px,3vw,26px);color:var(--ink-40);letter-spacing:-.02em}
.fo-reps.tick{animation:fo-tick .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes fo-tick{0%{transform:translateY(6px) scale(.97);color:var(--zest-deep)}100%{transform:none}}
.fo-bar{height:6px;background:var(--paper-2);border:1px solid var(--mist);margin-top:8px;overflow:hidden}
.fo-bar i{display:block;height:100%;width:60%;background:repeating-linear-gradient(90deg,var(--zest),var(--zest) 8px,var(--zest-deep) 8px,var(--zest-deep) 16px);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.fo-tele{padding:14px clamp(16px,2vw,24px);display:grid;gap:11px;font-family:"Space Mono",monospace;font-size:12.5px}
.fo-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.fo-row .k{color:var(--moss);letter-spacing:.05em;text-transform:uppercase;font-size:11px;display:flex;align-items:center;gap:7px}
.fo-row .k::before{content:"";width:5px;height:5px;background:var(--zest-deep);display:inline-block}
.fo-row .v{font-weight:700;letter-spacing:.02em}
.fo-lock{color:var(--spruce);background:var(--zest);padding:2px 8px;font-size:11px;letter-spacing:.08em}
.fo-lock.off{background:var(--paper-2);color:var(--moss)}
.fo-feed{margin-top:auto;border-top:1.5px solid var(--spruce);padding:14px clamp(16px,2vw,24px);background:var(--spruce);color:var(--paper);display:flex;align-items:center;gap:12px}
.fo-feed .chev{font-family:"Space Mono",monospace;color:var(--zest);flex:0 0 auto}
.fo-feed p{font-size:14px;line-height:1.35;transition:opacity .3s}
.fo-feed p b{color:var(--zest);font-weight:600}
</style>
</head>
<body>
<div class="fo-frame">
  <header class="fo-head">
    <div class="fo-mark"><span class="fo-eye" aria-hidden="true"></span>UNO·Q HEALTH CARE BOT<small>FIELD&nbsp;OPTICS</small></div>
    <div class="fo-head-spacer"></div>
    <div class="fo-status"><span class="fo-dot" id="dot"></span><span id="statusText">Connecting</span></div>
    <div class="fo-clock" id="clock">00:00:00</div>
  </header>

  <div class="fo-body">
    <section class="fo-view" aria-label="라이브 카메라 시야">
      <img class="fo-feed-img fo-hide" id="mjpeg" alt="robot live" />
      <video class="fo-feed-img fo-hide" id="cam" playsinline muted></video>
      <div class="fo-duo"></div>
      <div class="fo-grain"></div>
      <canvas class="fo-hud" id="hud"></canvas>
      <div class="fo-view-tag" id="viewTag">CAM&nbsp;01 · FOV 60°</div>
      <div class="fo-view-coord">PAN&nbsp;<b id="pan">+000.0°</b><br>TILT&nbsp;<b id="tilt">+00.0°</b><br><span id="trk">ACQUIRING…</span></div>
      <button class="fo-cta" id="camBtn" hidden>▶ 카메라 시야 열기</button>
    </section>

    <section class="fo-rail">
      <div class="fo-seg" role="group" aria-label="운동 모드">
        <button data-mode="Auto" aria-pressed="true">AUTO</button>
        <button data-mode="Squat" aria-pressed="false">SQUAT</button>
        <button data-mode="Push-up" aria-pressed="false">PUSH-UP</button>
      </div>
      <div class="fo-count">
        <div class="lbl" id="countLbl">현재 감지 · Tracking rep</div>
        <div class="fo-mode" id="mode">SQUAT</div>
        <div class="fo-reps" id="reps">0<span class="goal" id="goal">/ 20</span></div>
        <div class="fo-bar"><i id="barfill"></i></div>
      </div>
      <div class="fo-tele">
        <div class="fo-row"><span class="k">Auto-track</span><span class="fo-lock" id="lock">LOCKED</span></div>
        <div class="fo-row"><span class="k">Servo pan/tilt</span><span class="v" id="servo">0.0 / 0.0</span></div>
        <div class="fo-row"><span class="k">Track state</span><span class="v" id="tstate">—</span></div>
        <div class="fo-row"><span class="k">Inference</span><span class="v" id="fps">— FPS</span></div>
      </div>
      <div class="fo-feed"><span class="chev" aria-hidden="true">&gt;&gt;</span><p id="feed">로봇에 연결하는 중…</p></div>
    </section>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const API = `${location.protocol}//${location.hostname}:8080`;
  const hud = $("#hud"), ctx = hud.getContext("2d");
  const video = $("#cam"), mjpeg = $("#mjpeg"), camBtn = $("#camBtn");
  let W=0,H=0, dpr=Math.min(devicePixelRatio||1,2);
  let LIVE=false, demoStarted=false, hasCam=false, failStreak=0;

  const clk=$("#clock"), pad=n=>String(n).padStart(2,"0");
  setInterval(()=>{const d=new Date();clk.textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;},1000);

  function resize(){const r=hud.getBoundingClientRect();W=r.width;H=r.height;hud.width=W*dpr;hud.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  addEventListener("resize",resize);

  // reticle state
  let tx=.5,ty=.48,vtx=0,vty=0,target={x:.5,y:.45}; const pulses=[]; let t=0;
  function drawSkeleton(cx,cy,scale,phase){
    const s=scale,sq=(Math.sin(phase)*.5+.5);
    const hipY=cy-s*.05+sq*s*.5,kneeY=hipY+s*.55-sq*s*.12,footY=cy+s*1.0,shoY=hipY-s*.7,headY=shoY-s*.42,kneeX=s*.28+sq*s*.12;
    ctx.lineWidth=3;ctx.lineJoin="round";ctx.lineCap="round";ctx.strokeStyle="#C9E85B";ctx.fillStyle="rgba(201,232,91,.9)";
    const J=(x,y)=>{ctx.beginPath();ctx.arc(x,y,3.4,0,7);ctx.fill();},L=(a,b,c,d)=>{ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();};
    L(cx,shoY,cx,hipY);ctx.beginPath();ctx.arc(cx,headY,s*.16,0,7);ctx.stroke();
    L(cx,shoY,cx-s*.34,shoY+s*.02+sq*s*.1);L(cx,shoY,cx+s*.34,shoY+s*.02+sq*s*.1);
    L(cx,hipY,cx-kneeX,kneeY);L(cx-kneeX,kneeY,cx-s*.22,footY);L(cx,hipY,cx+kneeX,kneeY);L(cx+kneeX,kneeY,cx+s*.22,footY);
    [[cx,shoY],[cx,hipY],[cx-kneeX,kneeY],[cx+kneeX,kneeY]].forEach(p=>J(p[0],p[1]));
  }
  function loop(){
    t+=1/60; ctx.clearRect(0,0,W,H);
    if(!W){requestAnimationFrame(loop);return;}
    const k=.06,d=.82;
    vtx=(vtx+(target.x-tx)*k)*d;tx+=vtx; vty=(vty+(target.y-ty)*k)*d;ty+=vty;
    const cx=tx*W,cy=ty*H;
    if(!LIVE && !hasCam) drawSkeleton(cx,cy+H*.02,Math.min(W,H)*.16,t*2.0);
    const scanY=(t*40%(H+40))-20,g=ctx.createLinearGradient(0,scanY-30,0,scanY+30);
    g.addColorStop(0,"rgba(201,232,91,0)");g.addColorStop(.5,"rgba(201,232,91,.28)");g.addColorStop(1,"rgba(201,232,91,0)");
    ctx.fillStyle=g;ctx.fillRect(0,scanY-30,W,60);
    const bx=Math.min(W,H)*.17;ctx.strokeStyle="rgba(201,232,91,.95)";ctx.lineWidth=2;
    const corner=(x,y,sx,sy)=>{const l=14;ctx.beginPath();ctx.moveTo(x+sx*l,y);ctx.lineTo(x,y);ctx.lineTo(x,y+sy*l);ctx.stroke();};
    corner(cx-bx,cy-bx,1,1);corner(cx+bx,cy-bx,-1,1);corner(cx-bx,cy+bx,1,-1);corner(cx+bx,cy+bx,-1,-1);
    ctx.strokeStyle="rgba(201,232,91,.55)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-9,cy);ctx.lineTo(cx+9,cy);ctx.moveTo(cx,cy-9);ctx.lineTo(cx,cy+9);ctx.stroke();
    ctx.strokeStyle="rgba(201,232,91,.9)";ctx.beginPath();ctx.arc(cx,cy,3,0,7);ctx.stroke();
    for(let i=pulses.length-1;i>=0;i--){const p=pulses[i];p.r+=3.2;p.a-=.02;if(p.a<=0){pulses.splice(i,1);continue;}ctx.strokeStyle=`rgba(201,232,91,${p.a})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---- shared UI updaters ----
  let reps=0, goal=20;
  const repEl=$("#reps"), barEl=$("#barfill"), modeEl=$("#mode"), feedEl=$("#feed");
  function setReps(v,g){ if(g) goal=g; if(v!==reps){ reps=v; repEl.firstChild.textContent=v; repEl.classList.remove("tick");void repEl.offsetWidth;repEl.classList.add("tick"); pulses.push({x:tx*W,y:ty*H,r:Math.min(W,H)*.14,a:.9}); if(navigator.vibrate)navigator.vibrate(8);} $("#goal").textContent="/ "+goal; barEl.style.width=Math.min(100,reps/goal*100)+"%"; }
  function setFeed(html){ if(feedEl.dataset.cur===html) return; feedEl.dataset.cur=html; feedEl.style.opacity=0; setTimeout(()=>{feedEl.innerHTML=html;feedEl.style.opacity=1;},280); }

  // ---- LIVE ----
  function deriveFeedback(d){
    const p=d.ptz||{}, ex=d.exercise_active, a=d.angle_deg&&d.angle_deg.used;
    if(p.state==="lost") return "사람을 <b>찾는 중</b>입니다…";
    if(p.state==="edge") return "프레임 가장자리 — <b>로봇이 따라갑니다</b>.";
    if(d.app.session.status==="idle") return "준비되면 운동을 시작하세요. 로봇이 <b>지켜보고</b> 있습니다.";
    if(ex==="squat"){ const st=(d.squat.state||"").toUpperCase(); if(st.includes("DOWN")) return (a&&a<100)?"<b>좋은 깊이</b>입니다. 그대로 올라오세요.":"조금 더 <b>깊이</b> 앉아보세요."; return "무릎·발끝 정렬 <b>안정적</b>입니다."; }
    if(ex==="pushup"){ const st=(d.pushup.state||"").toUpperCase(); if(st.includes("DOWN")) return "<b>충분히 내려왔습니다</b>. 밀어 올리세요."; return "코어를 <b>단단히</b> 유지하세요."; }
    return "자세를 <b>인식하고</b> 있습니다…";
  }
  function enterLive(){
    LIVE=true; camBtn.hidden=true;
    try{ if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null;} }catch(e){}
    video.classList.add("fo-hide");
    mjpeg.src = `${API}/stream.mjpg`; mjpeg.classList.remove("fo-hide");
    $("#dot").classList.remove("sim"); $("#statusText").textContent="Live · Robot";
    $("#trk").textContent="TRACKING"; $("#viewTag").textContent="ROBOT CAM · /dev/video";
    $("#countLbl").textContent="실시간 감지 · Live rep";
  }
  function onLive(d){
    if(!LIVE) enterLive();
    // reticle from REAL tracked person center
    const pc=d.person_center_norm||[];
    if(pc[0]!=null && pc[1]!=null){ target={x:pc[0],y:pc[1]}; }
    // active exercise + reps
    const ex = (d.exercise_active==="squat"||d.exercise_active==="pushup") ? d.exercise_active : (d.app.session.mode==="pushup"?"pushup":"squat");
    const rc = ex==="pushup"?d.pushup:d.squat;
    modeEl.textContent = ex.toUpperCase();
    setReps(rc.reps|0, d.app.session.target_reps||20);
    // segmented reflect mode
    document.querySelectorAll(".fo-seg button").forEach(b=>b.setAttribute("aria-pressed", (b.dataset.mode.toLowerCase()===d.app.session.mode)?"true":"false"));
    // telemetry (pan/tilt are absolute servo deg around 180 center)
    const p=d.ptz||{}, panRel=(p.pan_deg!=null?p.pan_deg-180:0), tiltRel=(p.tilt_deg!=null?p.tilt_deg-180:0);
    $("#pan").textContent=(panRel>=0?"+":"")+panRel.toFixed(1)+"°";
    $("#tilt").textContent=(tiltRel>=0?"+":"")+tiltRel.toFixed(1)+"°";
    $("#servo").textContent=`${panRel.toFixed(1)} / ${tiltRel.toFixed(1)}`;
    $("#tstate").textContent=(p.state||"—").toUpperCase();
    const lock=$("#lock"); if(p.auto_track_enabled){lock.textContent="LOCKED";lock.classList.remove("off");}else{lock.textContent="MANUAL";lock.classList.add("off");}
    $("#fps").textContent=(d.fps!=null?d.fps.toFixed(1):"—")+" FPS";
    setFeed(deriveFeedback(d));
  }

  // ---- DEMO fallback (no robot) ----
  async function startCam(){
    try{ const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false}); video.srcObject=s; await video.play(); hasCam=true; camBtn.hidden=true; video.classList.remove("fo-hide"); $("#trk").textContent="TRACKING (LOCAL)"; }
    catch(e){ hasCam=false; camBtn.textContent="카메라 없음 · 데모 스켈레톤"; camBtn.hidden=false; $("#trk").textContent="SIM MODE"; }
    resize();
  }
  camBtn.addEventListener("click", startCam);
  function startDemo(){
    if(demoStarted||LIVE) return; demoStarted=true;
    $("#dot").classList.add("sim"); $("#statusText").textContent="Demo (no robot)";
    $("#viewTag").textContent="DEMO · LOCAL CAM";
    startCam();
    setInterval(()=>{ if(LIVE)return; const nx=(reps>=goal?8:reps+1); repEl.firstChild.textContent=nx; setReps(nx,20); },2200);
    setInterval(()=>{ if(LIVE)return; target={x:.32+Math.random()*.36,y:.34+Math.random()*.28}; },2600);
    const feeds=["무릎과 발끝 정렬이 <b>안정적</b>입니다.","허리 중립 유지 — <b>좋은 깊이</b>입니다.","상체가 앞으로 쏠립니다. <b>가슴을 펴세요</b>.","템포 일정 · <b>호흡을 놓치지 마세요</b>."];
    let fi=0; setInterval(()=>{ if(LIVE)return; fi=(fi+1)%feeds.length; setFeed(feeds[fi]); },4200);
    modeEl.textContent="SQUAT";
  }

  // ---- poll ----
  async function poll(){
    try{
      const r=await fetch(`${API}/stats.json`,{cache:"no-store"});
      if(!r.ok) throw 0;
      onLive(await r.json()); failStreak=0;
    }catch(e){ failStreak++; if(!LIVE && !demoStarted && failStreak>=3) startDemo(); }
    setTimeout(poll, 500);
  }
  addEventListener("load", ()=>{ resize(); poll(); });
  // exercise selector (visual — live syncs to real mode next poll)
  document.querySelectorAll(".fo-seg button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".fo-seg button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");modeEl.textContent=b.dataset.mode.toUpperCase();}));
})();
</script>
</body>
